name: dockrepair-live-fixture

services:
  prerequisite:
    image: busybox:1.36
    command: ["sh", "-c", "while true; do sleep 3600; done"]
    healthcheck:
      test: ["CMD", "true"]
      interval: 2s
      timeout: 1s
      retries: 5

  app:
    image: busybox:1.36
    command: ["sh", "-c", "while true; do sleep 3600; done"]
    depends_on:
      prerequisite:
        condition: service_healthy
