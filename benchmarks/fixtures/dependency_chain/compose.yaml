name: dockrepair-dependency-chain

services:
  website:
    image: busybox:1.36.1
    command: ["sh", "-c", "while true; do sleep 3600; done"]
    labels:
      com.dockrepair.contract.api: "tcp://api:8080"
    networks: [backend]

  api:
    image: busybox:1.36.1
    command:
      - sh
      - -c
      - |
        while true; do
          if nc -z -w 1 database 5432; then
            pidof httpd >/dev/null || httpd -p 8080
          else
            killall httpd 2>/dev/null || true
          fi
          sleep 0.1
        done
    labels:
      com.dockrepair.contract.database: "tcp://database:5432"
    networks: [backend]
    depends_on:
      database:
        condition: service_started

  database:
    image: busybox:1.36.1
    command: ["sh", "-c", "httpd -p 5432; while true; do sleep 3600; done"]
    networks: [backend]

networks:
  backend: {}
