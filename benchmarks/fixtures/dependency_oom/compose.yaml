name: dockrepair-dependency-oom

services:
  api:
    image: busybox:1.36.1
    command: ["sh", "-c", "while true; do sleep 3600; done"]
    labels:
      com.dockrepair.contract.memory-db: "tcp://database:5432"
    networks: [backend]
  database:
    image: busybox:1.36.1
    command: ["sh", "-c", "awk 'BEGIN { for (i=0; i<10000000; i++) a[i]=i }'"]
    mem_limit: 8m
    restart: "no"
    networks: [backend]

networks:
  backend: {}
