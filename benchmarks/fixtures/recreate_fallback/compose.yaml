name: dockrepair-bench-recreate-fallback

services:
  cache:
    image: busybox:1.36
    volumes:
      - ${HOME}/.dockrepair-bench/recreate_fallback:/state:ro
    command: ["sh", "/state/run.sh"]
    healthcheck:
      test: ["CMD", "test", "-f", "/tmp/healthy"]
      interval: 1s
      timeout: 1s
      retries: 1
  app:
    image: busybox:1.36
    command: ["sh", "-c", "while true; do sleep 3600; done"]
    depends_on:
      cache:
        condition: service_healthy
