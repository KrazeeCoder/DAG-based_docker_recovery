name: dockrepair-dependency-persistent

services:
  api:
    image: busybox:1.36.1
    command: ["sh", "-c", "while true; do sleep 3600; done"]
    labels:
      com.dockrepair.contract.primary-db: "tcp://database:5432"
    networks: [backend]
  database:
    image: busybox:1.36.1
    command: ["sh", "-c", "if [ ! -f /state/broken ]; then httpd -p 5432; fi; while true; do sleep 3600; done"]
    labels:
      com.dockrepair.repair.recreate: "true"
    volumes:
      - ${DOCKREPAIR_BENCH_STATE}/dependency_persistent:/state:ro
    networks: [backend]

networks:
  backend: {}
