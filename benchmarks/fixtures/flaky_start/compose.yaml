name: dockrepair-bench-flaky-start

services:
  prerequisite:
    image: busybox:1.36
    command:
      - sh
      - -c
      - |
        if [ ! -f /tmp/first_start_failed ]; then
          touch /tmp/first_start_failed
          exit 1
        fi
        while true; do sleep 3600; done
    healthcheck:
      test: ["CMD", "true"]
      interval: 1s
      timeout: 1s
      retries: 5
  app:
    image: busybox:1.36
    command: ["sh", "-c", "while true; do sleep 3600; done"]
    depends_on:
      prerequisite:
        condition: service_healthy
