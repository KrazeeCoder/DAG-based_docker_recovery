name: dockrepair-bench-flaky-start

services:
  prerequisite:
    image: busybox:1.36
    volumes:
      - ${HOME}/.dockrepair-bench/flaky_start:/state:ro
    command: ["sh", "/state/run.sh"]
    healthcheck:
      test: ["CMD", "true"]
      interval: 1s
      timeout: 1s
      retries: 5
  app:
    image: busybox:1.36
    command: ["sh", "-c", "while true; do sleep 3600; done"]
    depends_on:
      prerequisite:
        condition: service_healthy
