name: dockrepair-bench-stopped-chain

services:
  database:
    image: busybox:1.36
    command: ["sh", "-c", "while true; do sleep 3600; done"]
    healthcheck:
      test: ["CMD", "true"]
      interval: 1s
      timeout: 1s
      retries: 5

  api:
    image: busybox:1.36
    command: ["sh", "-c", "while true; do sleep 3600; done"]
    depends_on:
      database:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "true"]
      interval: 1s
      timeout: 1s
      retries: 5

  worker:
    image: busybox:1.36
    command: ["sh", "-c", "while true; do sleep 3600; done"]
    depends_on:
      api:
        condition: service_healthy
