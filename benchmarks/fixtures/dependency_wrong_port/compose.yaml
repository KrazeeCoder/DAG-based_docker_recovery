name: dockrepair-dependency-wrong-port

services:
  api:
    image: busybox:1.36.1
    command: ["sh", "-c", "while true; do sleep 3600; done"]
    labels:
      com.dockrepair.contract.primary-db: "tcp://database:5433"
    networks: [backend]
  database:
    image: busybox:1.36.1
    command: ["sh", "-c", "httpd -p 5432; while true; do sleep 3600; done"]
    labels:
      com.dockrepair.repair.recreate: "true"
    networks: [backend]

networks:
  backend: {}
