[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "dockrepair"
version = "0.1.0"
description = "A deterministic symbolic planner for Docker Compose repair plans"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "State-Based Representation Project" }]
dependencies = []

[project.scripts]
dockrepair = "dockrepair:main"

[tool.setuptools]
package-dir = { "" = "src" }
py-modules = ["dockrepair", "dockrepair_data", "dockrepair_diagnosis", "dockrepair_docker", "dockrepair_graph", "dockrepair_planner"]
